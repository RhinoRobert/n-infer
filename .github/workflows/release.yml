name: Release

# Push a tag like v0.1.0-beta.1 to build every binary and publish to npm.
# Run it by hand ("Run workflow") with dry-run on to rehearse without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and stage everything but do not publish
        type: boolean
        default: true

permissions:
  contents: read

# Never run two releases at once: a half-finished publish cannot be undone.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag, package.json and Cargo.toml must all name the same version.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$cargo_version" ]; then
            echo "package.json ($version) and Cargo.toml ($cargo_version) disagree"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version v$version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "npm-tag=beta" >> "$GITHUB_OUTPUT" ;;
            *)   echo "npm-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # The CUDA add-on may fail without blocking the release: the CPU package is the required one,
    # and the main package only references the binary packages that were actually built.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CPU binary is built where CI builds and tests it (windows-latest), so what ships is
          # what the test suite ran against.
          - { target: win32-x64-msvc, os: windows-latest, flags: '--cpu --portable' }
          # The CUDA job needs windows-2022: it has Visual Studio 2022, while windows-latest moved
          # to Visual Studio 2026, which CUDA 12.8 does not support.
          # CUDA 12.8 here; the local tests used CUDA 13.4, so this is built for the first time in CI.
          - {
              target: win32-x64-msvc-cuda,
              os: windows-2022,
              flags: '--cuda --portable',
              cuda: true,
              experimental: true,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - if: matrix.cuda
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
      # The toolkit installer does not always register its Visual Studio integration on a hosted
      # runner, and CMake then stops with "No CUDA toolset found". Copy the build customizations
      # into Visual Studio ourselves.
      - if: matrix.cuda
        shell: pwsh
        run: |
          $src = Join-Path $env:CUDA_PATH 'extras\visual_studio_integration\MSBuildExtensions'
          $instances = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -property installationPath
          foreach ($vs in $instances) {
            # v170 = Visual Studio 2022, v180 = Visual Studio 2026: fill whichever this instance has.
            foreach ($vc in Get-ChildItem (Join-Path $vs 'MSBuild\Microsoft\VC') -Directory -Filter 'v1?0' -ErrorAction SilentlyContinue) {
              $dest = Join-Path $vc.FullName 'BuildCustomizations'
              New-Item -ItemType Directory -Force $dest | Out-Null
              Copy-Item "$src\*" $dest -Force
              "$dest -> " + ((Get-ChildItem $dest -Filter 'CUDA*' | Select-Object -ExpandProperty Name) -join ', ')
            }
          }
      - run: npm ci
      - run: npm run build -- ${{ matrix.flags }}
      - name: Load the binary (CPU builds can run on the runner)
        if: ${{ !matrix.cuda }}
        run: node -e "import('./lib/index.js').then(m => console.log(m.backend, m.hardware().physicalCores, 'cores'))"
      - name: Stage binary
        shell: bash
        run: mkdir -p out/${{ matrix.target }} && cp lib/n-infer.node out/${{ matrix.target }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          # Upload the `out` folder, so the artifact holds <target>/n-infer.node and the layout is
          # the same whether one binary was built or several.
          path: out
          if-no-files-found: error

  # Stages and checks every package. Needs no secrets and no approval, so a dry run can use it
  # freely; the same output is what the publish job uploads to npm.
  stage:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true # artifacts/<target>/n-infer.node, however many targets were built
          path: artifacts
      - run: find artifacts -type f
      - run: node scripts/stage-npm.js artifacts
      - name: Name release assets by platform (they would all be called n-infer.node)
        run: |
          mkdir release-assets
          for dir in artifacts/*/; do
            target=$(basename "$dir")
            cp "$dir/n-infer.node" "release-assets/n-infer-$target.node"
          done
          ls -l release-assets
      - name: Check every package's contents
        run: for dir in dist/npm/*/; do node scripts/check-pack.js "$dir"; done
      - run: npm install -g npm@latest # `npm stage` needs npm >= 11.15 (Node 22 ships an older one)
      - name: Rehearse staging (changes nothing on npm)
        env:
          NPM_TAG: ${{ needs.verify.outputs.npm-tag }} # npm refuses a prerelease without --tag
        run: for dir in dist/npm/*/; do npm stage publish "$dir" --dry-run --access public --tag "$NPM_TAG"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged-packages
          path: |
            dist/npm
            release-assets
          if-no-files-found: error

  # The only job that touches npm, and it can only STAGE: the token is "stage only", so nothing goes
  # live until the maintainer approves each package on npm with 2FA (`npm stage approve`, or the
  # "Staged Packages" page). It runs for a pushed version tag, never for a dry run, and the
  # protected `npm-publish` environment (a required reviewer, v* tags only) must approve it first.
  publish:
    needs: [verify, stage]
    if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # `npm stage` needs npm >= 11.15; trusted publishing >= 11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged-packages
          path: staged
      - name: Stage the binary packages, then the main package (nothing goes live yet)
        env:
          # A stage-only npm token (cannot publish directly). It can be replaced by a stage-only
          # trusted-publishing configuration once every package exists on npm.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.verify.outputs.npm-tag }}
        run: |
          for dir in staged/dist/npm/*/; do
            [ "$(basename "$dir")" = n-infer ] && continue
            npm stage publish "$dir" --provenance --access public --tag "$NPM_TAG"
          done
          npm stage publish staged/dist/npm/n-infer --provenance --access public --tag "$NPM_TAG"
      - name: Tell the maintainer what to approve
        run: |
          {
            echo "### Staged on npm, not live yet"
            echo "Approve every package with 2FA, **binary packages first, \`n-infer\` last**:"
            echo '```'
            echo "npm stage list"
            echo "npm stage approve <stage-id>   # repeat for each, enter your 2FA code"
            echo '```'
            echo "Or use https://www.npmjs.com/ -> Staged Packages."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          files: staged/release-assets/*.node
