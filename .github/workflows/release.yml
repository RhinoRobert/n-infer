name: Release

# Push a tag like v0.1.0-beta.1 to build every binary and publish to npm.
# Run it by hand ("Run workflow") with dry-run on to rehearse without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and stage everything but do not publish
        type: boolean
        default: true

permissions:
  contents: read

# Never run two releases at once: a half-finished publish cannot be undone.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag, package.json and Cargo.toml must all name the same version.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$cargo_version" ]; then
            echo "package.json ($version) and Cargo.toml ($cargo_version) disagree"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version v$version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "npm-tag=beta" >> "$GITHUB_OUTPUT" ;;
            *)   echo "npm-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # Experimental targets may fail without blocking the release; their package is just not published.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64-msvc, os: windows-latest, flags: '--cpu --portable' }
          - {
              target: win32-x64-msvc-cuda,
              os: windows-latest,
              flags: '--cuda --portable',
              cuda: true,
            }
          - { target: linux-x64-gnu, os: ubuntu-22.04, flags: '--cpu --portable' }
          # Not yet built anywhere: the static cuBLAS binary may be very large (see docs/PACKAGING.md).
          - {
              target: linux-x64-gnu-cuda,
              os: ubuntu-22.04,
              flags: '--cuda --portable',
              cuda: true,
              experimental: true,
            }
          - { target: linux-arm64-gnu, os: ubuntu-22.04-arm, flags: '--cpu --portable' }
          - { target: darwin-arm64, os: macos-latest, flags: '--portable' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ matrix.target }}
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - if: matrix.os == 'windows-latest'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - if: matrix.cuda
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: ${{ runner.os == 'Windows' && '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]' || '["nvcc", "cudart", "cublas", "cublas_dev"]' }}
      - run: npm ci
      - run: npm run build -- ${{ matrix.flags }}
      - name: Load the binary (CPU builds can run on the runner)
        if: ${{ !matrix.cuda }}
        run: node -e "import('./lib/index.js').then(m => console.log(m.backend, m.hardware().physicalCores, 'cores'))"
      - name: Stage binary
        shell: bash
        run: mkdir -p out/${{ matrix.target }} && cp lib/n-infer.node out/${{ matrix.target }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: out/${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Protect this environment in repo settings so a human must approve every publish.
    environment: npm-publish
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: artifacts
      - name: Lay out artifacts as artifacts/<target>/n-infer.node
        run: |
          for dir in artifacts/bin-*; do mv "$dir" "artifacts/${dir#artifacts/bin-}"; done
          find artifacts -type f
      - run: node scripts/stage-npm.js artifacts
      - name: Name release assets by platform (they would all be called n-infer.node)
        run: |
          mkdir release-assets
          for dir in artifacts/*/; do
            target=$(basename "$dir")
            cp "$dir/n-infer.node" "release-assets/n-infer-$target.node"
          done
          ls -l release-assets
      - name: Check every package's contents
        run: for dir in dist/npm/*/; do node scripts/check-pack.js "$dir"; done && node scripts/check-pack.js
      - name: Publish platform packages, then the main package
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        env:
          # Optional: with trusted publishing configured on npm this token is not needed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.verify.outputs.npm-tag }}
        run: |
          for dir in dist/npm/*/; do
            npm publish "$dir" --provenance --access public --tag "$NPM_TAG"
          done
          npm publish --provenance --access public --tag "$NPM_TAG"
      - name: Rehearsal (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run != false }}
        run: |
          for dir in dist/npm/*/; do npm publish "$dir" --dry-run --access public; done
          npm publish --dry-run --access public
      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        if: ${{ github.event_name == 'push' }}
        with:
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          files: release-assets/*.node
