<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>n-infer chat</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #151b23;
        --panel-2: #1c242f;
        --line: #2a3441;
        --text: #e6edf3;
        --muted: #8b98a8;
        --accent: #3fb68b;
        --accent-2: #f2a65a;
        --danger: #f26d6d;
        --radius: 12px;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6f9;
          --panel: #ffffff;
          --panel-2: #eef1f5;
          --line: #d5dbe3;
          --text: #18212b;
          --muted: #5d6b7a;
          --accent: #14906a;
          --accent-2: #c76b12;
          --danger: #c93434;
          color-scheme: light;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .logo {
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .logo b {
        color: var(--accent);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        font-size: 12.5px;
        color: var(--muted);
      }
      .pill.ok {
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .ok .dot {
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
      }
      .busy .dot {
        background: var(--accent-2);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }

      main {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 0;
      }
      aside {
        border-right: 1px solid var(--line);
        padding: 18px;
        overflow-y: auto;
        background: var(--panel);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .card {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 13.5px;
        padding: 2px 0;
      }
      .row span:first-child {
        color: var(--muted);
      }
      .row span:last-child {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 8px;
        border-radius: 99px;
        background: var(--bg);
        overflow: hidden;
        margin: 6px 0 2px;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        width: 0;
        transition: width 0.4s;
      }
      select,
      textarea,
      input[type='text'] {
        width: 100%;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 10px;
        font: inherit;
      }
      select:focus,
      textarea:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent);
        outline-offset: 1px;
      }
      textarea {
        resize: vertical;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin: 10px 0 4px;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--accent);
      }
      button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: 0;
        border-radius: 9px;
        padding: 9px 16px;
        background: var(--accent);
        color: #04130d;
      }
      button.secondary {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
      }
      button.danger {
        background: var(--danger);
        color: #fff;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .hint {
        font-size: 12.5px;
        color: var(--muted);
      }

      section.chat {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 0;
      }
      #log {
        overflow-y: auto;
        padding: 22px 6vw;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scroll-behavior: smooth;
      }
      .msg {
        max-width: 780px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .msg.user {
        align-self: flex-end;
      }
      .bubble {
        padding: 10px 14px;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-wrap: anywhere;
      }
      .user .bubble {
        background: color-mix(in srgb, var(--accent) 16%, var(--panel));
        border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
      }
      .bubble pre {
        margin: 8px 0 2px;
        padding: 10px 12px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow-x: auto;
        font:
          13px/1.45 ui-monospace,
          'Cascadia Code',
          Menlo,
          monospace;
        white-space: pre;
      }
      .bubble code {
        font:
          13px ui-monospace,
          'Cascadia Code',
          Menlo,
          monospace;
        background: var(--bg);
        padding: 1px 5px;
        border-radius: 5px;
      }
      .caret::after {
        content: '▍';
        color: var(--accent);
        animation: pulse 0.9s infinite;
      }
      .stats {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .stats span {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 9px;
        font-variant-numeric: tabular-nums;
      }
      .stats .fast {
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
      }
      .note {
        font-size: 12.5px;
        color: var(--accent-2);
      }
      .empty {
        margin: auto;
        text-align: center;
        max-width: 520px;
        color: var(--muted);
      }
      .empty h1 {
        color: var(--text);
        font-size: 26px;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 18px;
      }
      .chips button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        font-weight: 500;
      }
      .chips button:hover:not(:disabled) {
        border-color: var(--accent);
      }

      form.composer {
        display: flex;
        gap: 10px;
        padding: 14px 6vw 18px;
        border-top: 1px solid var(--line);
        background: var(--panel);
        align-items: flex-end;
      }
      form.composer textarea {
        min-height: 46px;
        max-height: 180px;
        resize: none;
      }
      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
        }
        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          max-height: 40vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">n-<b>infer</b> chat</div>
      <span class="pill" id="runtime">connecting…</span>
      <span class="pill">no Ollama · no server · no Python</span>
      <span class="pill" id="process"></span>
    </header>

    <main>
      <aside>
        <div>
          <h2>Model</h2>
          <select id="model" aria-label="Model"></select>
          <div style="display: flex; gap: 8px; margin-top: 8px">
            <button id="load" class="secondary" style="flex: 1">Load model</button>
          </div>
          <p class="hint" id="modelStatus">
            Models found on this machine, read straight from disk.
          </p>
        </div>

        <div>
          <h2>This machine</h2>
          <div class="card" id="machine"></div>
        </div>

        <div>
          <h2>Generation</h2>
          <div class="card">
            <label for="temp" style="margin-top: 0">Temperature <b id="tempValue">0.7</b></label>
            <input type="range" id="temp" min="0" max="1.5" step="0.1" value="0.7" />
            <label for="maxTokens">Max reply length <b id="maxValue">400</b> tokens</label>
            <input type="range" id="maxTokens" min="32" max="1024" step="32" value="400" />
            <label for="system">System prompt</label>
            <textarea id="system" rows="3">You are a helpful, concise assistant.</textarea>
          </div>
        </div>
        <button id="clear" class="secondary">Clear conversation</button>
      </aside>

      <section class="chat">
        <div id="log" aria-live="polite"></div>
        <form class="composer" id="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Ask something…  (Enter to send, Shift+Enter for a new line)"
            aria-label="Message"
          ></textarea>
          <button type="submit" id="send">Send</button>
          <button type="button" id="stop" class="danger" hidden>Stop</button>
        </form>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
