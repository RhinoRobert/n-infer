[package]
name = "n-infer"
version = "0.1.0-beta.0"
edition = "2021"
rust-version = "1.80"
authors = ["Robert Serrano"]
license = "MIT"
description = "In-process GGUF inference for Node.js (llama.cpp via napi-rs)"
repository = "https://github.com/RhinoRobert/n-infer"
publish = false # shipped to npm, not crates.io

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "async"] }
napi-derive = "2"
# `common` exposes llama.cpp's memory fitter, used to pick GPU layers for the free VRAM.
llama-cpp-2 = { version = "=0.1.160", features = ["common"] }
# Same version llama-cpp-2 already pins; used for llama.cpp's own CPU feature report.
llama-cpp-sys-2 = "=0.1.160"
encoding_rs = "0.8"
num_cpus = "1"
sha2 = "0.10"

# Apple GPUs: Metal is the only accelerator there, so it is always on.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.160", features = ["common", "metal"] }

[build-dependencies]
napi-build = "2"

[features]
default = []
# Opt-in GPU backends. scripts/build.js enables `cuda` automatically when nvcc is found.
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
# Ship compute backends as separate libraries so the best CPU variant (SSE4.2 ... AVX-512) is
# picked at runtime. Experimental: see docs/PACKAGING.md.
dynamic = ["llama-cpp-2/dynamic-backends"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
